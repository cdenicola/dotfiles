# Keep paths portable when tmux starts outside a Zsh environment.
if-shell -F '#{==:#{XDG_CONFIG_HOME},}' \
  'set-environment -g XDG_CONFIG_HOME "$HOME/.config"'
if-shell -F '#{==:#{XDG_DATA_HOME},}' \
  'set-environment -g XDG_DATA_HOME "$HOME/.local/share"'
if-shell -F '#{==:#{TMUX_PLUGIN_MANAGER_PATH},}' \
  'set-environment -g TMUX_PLUGIN_MANAGER_PATH "$XDG_DATA_HOME/tmux/plugins"'

set -g default-terminal "tmux-256color"
set-option -sa terminal-features ",xterm*:RGB"
set -s set-clipboard external
set -g mouse on
set -g history-limit 100000
set -g focus-events on

#unbind C-b
#set -g prefix C-Space
#bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# Preserve the useful parts of the old status line with maintained Catppuccin
# modules: compact inactive windows, the active path, and machine identity.
set -g @catppuccin_flavor 'mocha'
set -g @catppuccin_window_status_style 'rounded'
set -g @catppuccin_window_number_color '#{@thm_blue}'
set -g @catppuccin_window_current_number_color '#{@thm_peach}'
set -g @catppuccin_window_text ' #W'
set -g @catppuccin_window_current_text ' #{s|^.*/([^/]+/[^/]+)$|\1|:pane_current_path}'
set -g @catppuccin_window_flags 'icon'
set -g @catppuccin_window_flags_icon_current ''
set -g @catppuccin_window_flags_icon_last ''
set -g @catppuccin_status_connect_separator 'yes'
set -g @catppuccin_user_text ' #{user}@#h'
set -g @catppuccin_date_time_text ' %H:%M'

set -g @plugin 'tmux-plugins/tpm#v3.1.0'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.0'

# Catppuccin must define its modules before they are composed below. TPM still
# owns installation and loads the remaining plugins at the end of this file.
if-shell 'test -x "$TMUX_PLUGIN_MANAGER_PATH/tmux/catppuccin.tmux"' \
  'run-shell "$TMUX_PLUGIN_MANAGER_PATH/tmux/catppuccin.tmux"'

set -g status-position bottom
set -g status-interval 5
set -g status-left-length 0
set -g status-right-length 120
set -g status-left ''
set -g status-right '#{E:@catppuccin_status_user}'
set -ag status-right '#{E:@catppuccin_status_session}'
set -ag status-right '#{E:@catppuccin_status_date_time}'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# reload
bind r run-shell 'tmux source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" && tmux display-message "Reloaded!"'

# Keep plugin checkouts out of ~/.config and initialize TPM last.
if-shell 'test -x "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"' \
  'run-shell "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"'
