# Keep paths portable when tmux starts outside a Zsh environment.
if-shell -F '#{==:#{XDG_CONFIG_HOME},}' \
  'set-environment -g XDG_CONFIG_HOME "$HOME/.config"'
if-shell -F '#{==:#{XDG_DATA_HOME},}' \
  'set-environment -g XDG_DATA_HOME "$HOME/.local/share"'
if-shell -F '#{==:#{TMUX_PLUGIN_MANAGER_PATH},}' \
  'set-environment -g TMUX_PLUGIN_MANAGER_PATH "$XDG_DATA_HOME/tmux/plugins"'

set -g default-terminal "tmux-256color"
set-option -sa terminal-features ",xterm*:RGB"
set -g mouse on
set -g history-limit 100000
set -g focus-events on

#unbind C-b
#set -g prefix C-Space
#bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-option -g renumber-windows on

# Use Alt-arrow keys without prefix key to switch panes
bind -n M-Left select-pane -L
bind -n M-Right select-pane -R
bind -n M-Up select-pane -U
bind -n M-Down select-pane -D

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

set -g @catppuccin_flavor 'mocha'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux#v2.3.0'
set -g @plugin 'tmux-plugins/tmux-yank'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

# reload
bind r run-shell 'tmux source-file "$XDG_CONFIG_HOME/tmux/tmux.conf" && tmux display-message "Reloaded!"'

# Keep plugin checkouts out of ~/.config and initialize TPM last.
if-shell 'test -x "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"' \
  'run-shell "$TMUX_PLUGIN_MANAGER_PATH/tpm/tpm"'
